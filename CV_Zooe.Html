<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>CV Zoe Valerie</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffe6f0; /* Pink muda */
      margin: 0;
      padding: 0;
    }
    .cv-container {
      width: 70%;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border: 3px solid #ffb6c1;
      position: relative;
    }
    h1, h2 {
      color: #d63384;
    }
    .header {
      text-align: center;
      border-bottom: 2px dashed #ffb6c1;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .section {
      margin-bottom: 20px;
    }
    ul {
      list-style-type: "✨ ";
      padding-left: 20px;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin-top: 30px;
    }
    /* Hiasan */
    .cv-container::before, .cv-container::after {
      content: "🌸";
      font-size: 30px;
      position: absolute;
      color: #ff69b4;
    }
    .cv-container::before {
      top: -15px;
      left: -15px;
    }
    .cv-container::after {
      bottom: -15px;
      right: -15px;
    }
    a {
      color: #d63384;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
