<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Race Car</title>

<style>
body{
    margin:0;
    text-align:center;
    background:#222;
    font-family:Arial;
    color:white;
}

#game{
    width:300px;
    height:500px;
    background:#555;
    margin:auto;
    overflow:hidden;
    position:relative;
    border:5px solid white;
}

.road{
    position:absolute;
    width:10px;
    height:80px;
    background:white;
    left:145px;
    animation:road 1s linear infinite;
}

@keyframes road{
    from{top:-100px}
    to{top:500px}
}


#player{
    width:50px;
    height:80px;
    background:red;
    position:absolute;
    bottom:20px;
    left:125px;
    border-radius:10px;
    font-size:35px;
}


.enemy{
    width:50px;
    height:80px;
    background:yellow;
    position:absolute;
    top:-100px;
    border-radius:10px;
    font-size:35px;
}


button{
    padding:15px 25px;
    margin:10px;
    border:0;
    border-radius:20px;
    background:#ff6688;
    color:white;
}
</style>

</head>

<body>

<h1>🏎️ Race Car</h1>

<h2>
Score : <span id="score">0</span>
<br>
Level : <span id="level">1</span>
</h2>


<div id="game">

<div id="player">🏎️</div>

</div>


<button onclick="kiri()">⬅️</button>
<button onclick="kanan()">➡️</button>


<script>

let player=document.getElementById("player");
let game=document.getElementById("game");

let score=0;
let level=1;
let posisi=125;
let speed=5;


function jalan(){

let garis=document.createElement("div");

garis.className="road";

game.appendChild(garis);


setTimeout(()=>{
garis.remove();
},1000);

}


setInterval(jalan,300);



function musuh(){

let enemy=document.createElement("div");

enemy.className="enemy";

enemy.innerHTML="🚗";

enemy.style.left=
Math.floor(Math.random()*250)+"px";


game.appendChild(enemy);


let turun=setInterval(()=>{

let y=enemy.offsetTop+speed;

enemy.style.top=y+"px";


if(y>500){

enemy.remove();

clearInterval(turun);

score++;

document.getElementById("score").innerHTML=score;


if(score%10==0){

level++;

speed++;

document.getElementById("level").innerHTML=level;

}

}



if(tabrak(enemy)){

alert("Game Over! Score: "+score);

location.reload();

}


},20);


}



setInterval(musuh,1500);



function kiri(){

posisi-=30;

if(posisi<0)
posisi=0;

player.style.left=posisi+"px";

}



function kanan(){

posisi+=30;

if(posisi>250)
posisi=250;

player.style.left=posisi+"px";

}



function tabrak(e){

let a=player.getBoundingClientRect();
let b=e.getBoundingClientRect();

return !(a.right<b.left||
a.left>b.right||
a.bottom<b.top||
a.top>b.bottom);

}



document.addEventListener("keydown",e=>{

if(e.key=="ArrowLeft")
kiri();

if(e.key=="ArrowRight")
kanan();

});

</script>

</body>
</html>
